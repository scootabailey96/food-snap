<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex,nofollow">
<title>Food Snap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="queueNote" hidden></div>

<!-- 0. Passcode -->
<section id="s-lock" class="screen">
  <form id="lockForm" autocomplete="off">
    <div class="big">🔒</div>
    <div id="lockTitle">Set a passcode</div>
    <div class="status" id="lockHint">Stored on this phone only. It is attached to every photo you send.</div>
    <input id="lockInput" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Passcode" required>
    <button id="lockSave" type="submit" class="primary">Save passcode</button>
    <button id="lockCancel" type="button" hidden>Cancel</button>
  </form>
</section>

<!-- 1. Camera -->
<section id="s-cam" class="screen">
  <div id="cam">
    <video id="preview" playsinline muted autoplay></video>
    <div id="camMsg"><div id="camMsgText">Starting camera…</div>
      <button id="enableCam" hidden>Enable camera</button></div>
  </div>
  <div class="bar">
    <label class="btn pill" for="sysCam">📷 System camera</label>
    <label class="btn pill" for="gallery">🖼 Gallery</label>
    <button id="shutter" class="shutter" aria-label="Take photo"></button>
    <button id="flip" class="pill" aria-label="Switch camera">🔄</button>
  </div>
  <a href="#" id="backReview" class="link" hidden>← Back to review</a>
  <a href="#" id="changePassCam" class="link">Change passcode</a>
  <!-- Native camera app (capture=environment); also works if getUserMedia is denied -->
  <input id="sysCam" type="file" accept="image/*" capture="environment" hidden>
  <!-- Gallery picker (no capture attr, so the phone offers its photo library) -->
  <input id="gallery" type="file" accept="image/*" multiple hidden>
</section>

<!-- 2. Review -->
<section id="s-review" class="screen">
  <div id="review">
    <div class="row between"><span id="photoCount" class="pill">0 / 6 photos</span></div>
    <div id="thumbs"></div>
    <div class="row">
      <button id="addCam" type="button">📷 Add another</button>
      <button id="addGallery" type="button">🖼 From gallery</button>
    </div>
    <textarea id="note" placeholder="Optional note: one meal (dish + label) or list items. What, how much, how you felt…"></textarea>
    <div class="row">
      <button id="rec">🎙️ Voice note</button>
      <span id="recTime" class="pill" hidden>0:00</span>
      <button id="recClear" hidden>✕</button>
    </div>
    <audio id="audioPlayback" controls hidden></audio>
    <div class="status" id="status"></div>
    <button id="confirm">✔ Confirm &amp; send</button>
    <div class="row"><button id="retake">↩ Start over</button></div>
    <a href="#" id="changePass" class="link">Change passcode</a>
  </div>
</section>

<!-- 3. Done -->
<section id="s-done" class="screen">
  <div id="done">
    <div class="big" id="doneIcon">✅</div>
    <div id="doneText">Sent!</div>
    <button id="again" style="background:var(--accent);color:#04200f;font-weight:700;font-size:22px;width:100%;min-height:68px">📷 Next meal</button>
  </div>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
